# Deploy: GitHub (main) → Hostinger (public_html)
#
# No hPanel: Websites → teu site → Remote access
#   - Ativa SFTP (toggle)
#   - Anota: IP/hostname, utilizador FTP, porta SFTP (65002)
#
# GitHub → Settings → Secrets and variables → Actions → Secrets:
#   HOST  → IP do painel (ex. 186.202.157.79) ou ftp.teudominio.com
#   USER  → utilizador FTP (ex. u123456789)
#   PASS  → senha FTP (= senha SFTP no Hostinger)
#
# Variável opcional (Variables): DEPLOY_PORT → só se a tua conta usar outra porta
# Secret opcional: GOOGLE_SITE_VERIFICATION → token da meta tag do Search Console

on:
  push:
    branches:
      - main

name: Deploy website on push

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUXT_STUDIO: '0'

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run generate

      - name: Prepare deploy bundle
        run: |
          rm -rf .output/public/_studio-app .output/public/_studio .output/public/__nuxt_content
          test -f .output/public/index.html
          test -f .output/public/sitemap.xml
          test -f .output/public/robots.txt
          echo "Deploy size:" && du -sh .output/public
          echo "File count:" && find .output/public -type f | wc -l

      - name: Test Hostinger ports (diagnostic)
        continue-on-error: true
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          set +e
          echo "Host: $HOST"
          for port in 65002 21; do
            if timeout 8 bash -c "echo >/dev/tcp/${HOST}/${port}" 2>/dev/null; then
              echo "  port $port: reachable from GitHub"
            else
              echo "  port $port: not reachable"
            fi
          done

      - name: Sync to Hostinger (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          port: ${{ vars.DEPLOY_PORT || '65002' }}
          local_path: '.output/public/*'
          remote_path: './public_html/'
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=60 -o ServerAliveInterval=30 -o StrictHostKeyChecking=no'
