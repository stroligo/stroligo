# Deploy: GitHub (main) → Hostinger (public_html)
#
# No hPanel: Websites → teu site → Remote access
#   - Ativa SFTP (toggle)
#   - Anota: IP/hostname, utilizador FTP, porta SFTP (65002)
#
# GitHub → Settings → Secrets and variables → Actions → Secrets:
#   HOST  → IP do painel (ex. 186.202.157.79) ou ftp.teudominio.com
#   USER  → utilizador FTP (ex. u123456789)
#   PASS  → senha FTP (= senha SFTP no Hostinger)
#
# Variável opcional (Variables): DEPLOY_PORT → só se a tua conta usar outra porta
# Secret opcional: GOOGLE_SITE_VERIFICATION → token da meta tag do Search Console

name: Deploy website on push

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NUXT_STUDIO: '0'

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run generate

      - name: Prepare deploy bundle
        run: |
          rm -rf .output/public/_studio-app .output/public/_studio .output/public/__nuxt_content

          test -f .output/public/index.html
          test -f .output/public/sitemap.xml
          test -f .output/public/robots.txt

          echo "Deploy size:"
          du -sh .output/public

          echo "File count:"
          find .output/public -type f | wc -l

      - name: Test Hostinger SFTP (diagnostic)
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '65002' }}
        run: |
          set -euo pipefail

          echo "Host: ${HOST:-<missing HOST secret>}"
          echo "Port: $PORT"

          if [ -z "${HOST:-}" ]; then
            echo "::error::Secret HOST não configurado"
            exit 1
          fi

          if bash -c "echo >/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
            echo "SFTP port $PORT is reachable from GitHub runners"
          else
            echo "::warning::Port $PORT not reachable from this runner."
          fi

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sync to Hostinger (SFTP)
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
          PORT: ${{ vars.DEPLOY_PORT || '65002' }}
        run: |
          set -euo pipefail

          for var in HOST USER PASS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret $var não configurado em GitHub → Settings → Secrets → Actions"
              exit 1
            fi
          done

          echo "Uploading $(find .output/public -type f | wc -l) files to public_html/..."

          lftp -u "$USER","$PASS" "sftp://$HOST:$PORT" <<'LFTP'
          set sftp:auto-confirm yes
          set cmd:fail-exit yes

          # Mais tolerância à conexão da Hostinger
          set net:timeout 120
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set xfer:clobber on

          # Upload sem paralelismo
          mirror -R --verbose --continue .output/public/ public_html/

          bye
          LFTP
