# Deploy static assets → Hostinger public_html (SFTP)
#
# Needed because Hostinger Web App Node serves HTML, but /_nuxt/* is read from
# public_html by hCDN — and that folder never gets the client chunks.
#
# Secrets: HOST, USER, PASS  |  optional var: DEPLOY_PORT (default 65002)

on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Deploy static assets (SFTP)

concurrency:
  group: deploy-static-assets
  cancel-in-progress: false

env:
  NUXT_STUDIO: '0'

jobs:
  deploy:
    name: Sync .output/public → public_html
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same command as Hostinger Web App → same content hashes for /_nuxt
      - name: Build (match Hostinger)
        env:
          NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Prepare public bundle
        run: |
          rm -rf .output/public/_studio-app .output/public/_studio .output/public/__nuxt_content
          test -d .output/public/_nuxt
          echo "Nuxt chunks:" && find .output/public/_nuxt -type f | wc -l
          du -sh .output/public

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync public_html via SFTP
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
          PORT: ${{ vars.DEPLOY_PORT || '65002' }}
        run: |
          set -euo pipefail
          for var in HOST USER PASS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret $var missing"
              exit 1
            fi
          done

          echo "Uploading $(find .output/public -type f | wc -l) files…"
          # _nuxt first so HTML never points at missing chunks mid-upload
          lftp -u "$USER","$PASS" "sftp://$HOST:$PORT" <<'LFTP'
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:timeout 90
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          mirror -R --verbose --parallel=1 .output/public/_nuxt/ public_html/_nuxt/
          mirror -R --verbose --parallel=1 --exclude-glob '_nuxt/**' .output/public/ public_html/
          bye
          LFTP

          echo "SFTP sync finished."
