# Deploy: GitHub (main) → Hostinger (public_html)
#
# No hPanel: Websites → teu site → Remote access
#   - Ativa SFTP (toggle)
#   - Anota: IP/hostname, utilizador FTP, porta SFTP (65002)
#
# GitHub → Settings → Secrets and variables → Actions → Secrets:
#   HOST  → IP do painel (ex. 186.202.157.79) ou ftp.teudominio.com
#   USER  → utilizador FTP (ex. u123456789)
#   PASS  → senha FTP (= senha SFTP no Hostinger)
#
# Variável opcional (Variables): DEPLOY_PORT → só se a tua conta usar outra porta
# Secret opcional: GOOGLE_SITE_VERIFICATION → token da meta tag do Search Console

# Desativado no push: o site está na Hostinger como Web App Node.js.
# Deploy automático por SFTP competia com a Hostinger e deixava /_nuxt em 404.
# Para forçar sync SFTP manualmente: Actions → este workflow → Run workflow.
on:
  workflow_dispatch:

name: Deploy website on push (SFTP manual)

concurrency:
  # Não cancelar deploy a meio — deixa o Hostinger com HTML novo e /_nuxt incompleto (404).
  group: deploy-production
  cancel-in-progress: false

env:
  NUXT_STUDIO: '0'

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run generate

      - name: Prepare deploy bundle
        run: |
          rm -rf .output/public/_studio-app .output/public/_studio .output/public/__nuxt_content
          test -f .output/public/index.html
          test -f .output/public/sitemap.xml
          test -f .output/public/robots.txt
          test -d .output/public/_nuxt
          echo "Deploy size:" && du -sh .output/public
          echo "File count:" && find .output/public -type f | wc -l
          echo "Nuxt chunks:" && find .output/public/_nuxt -type f | wc -l

      - name: Test Hostinger SFTP (diagnostic)
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '65002' }}
        run: |
          set -euo pipefail
          echo "Host: ${HOST:-<missing HOST secret>}"
          echo "Port: $PORT"
          if [ -z "${HOST:-}" ]; then
            echo "::error::Secret HOST não configurado em GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          if bash -c "echo >/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
            echo "SFTP port $PORT is reachable from GitHub runners"
          else
            echo "::warning::Port $PORT not reachable from this runner (Hostinger may block GitHub IPs). Deploy will still be attempted."
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync to Hostinger (SFTP)
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
          PORT: ${{ vars.DEPLOY_PORT || '65002' }}
        run: |
          set -euo pipefail
          for var in HOST USER PASS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret $var não configurado em GitHub → Settings → Secrets → Actions"
              exit 1
            fi
          done

          echo "Uploading $(find .output/public -type f | wc -l) files to public_html/ …"
          echo "1) /_nuxt first (JS/CSS), then 2) HTML and the rest — avoids 404 after partial sync."

          # Ordem importa: chunks hashed antes do index.html que os referencia.
          # parallel baixo: Hostinger/SFTP costuma falhar com muitas ligações.
          lftp -u "$USER","$PASS" "sftp://$HOST:$PORT" <<'LFTP'
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          mirror -R --verbose --parallel=2 .output/public/_nuxt/ public_html/_nuxt/
          mirror -R --verbose --parallel=2 --exclude-glob '_nuxt/**' .output/public/ public_html/
          bye
          LFTP

          echo "Deploy sync finished."
